<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--border:#dce2ec;--accent:#2563eb;--good:#15803d;--goodbg:#ecfdf3;--bad:#b91c1c;--badbg:#fef2f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 18px}
.header-inner,main,.stats{max-width:1100px;margin:auto}h1{font-size:20px;margin:0 0 4px}.subtitle,.stats{font-size:13px;color:var(--muted)}
.controls{max-width:1100px;margin:14px auto 10px;display:flex;gap:8px;flex-wrap:wrap;padding:0 12px}
input,select,button{font:inherit}input,select{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 11px}input{flex:1;min-width:220px}
button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}button.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}button:disabled{opacity:.55;cursor:not-allowed}
.stats{padding:0 12px;margin-bottom:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:10px 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.qhead{padding:16px 17px 8px;font-weight:700;line-height:1.5}.qnum{color:var(--accent);margin-right:7px}
.visual{padding:4px 17px 14px}.visual-label{font-size:12px;color:var(--muted);margin:0 0 7px}.visual img{display:block;width:100%;max-height:720px;object-fit:contain;border:1px solid var(--border);border-radius:8px;background:#fafafa}
.options{padding:0 17px 12px}.option{padding:11px 12px;margin:7px 0;border:2px solid var(--border);border-radius:9px;line-height:1.5;background:#fff;cursor:pointer;transition:.12s}
.option:hover{border-color:#93c5fd;background:#f8fbff}.option.selected{border-color:var(--accent);background:#eff6ff}
.option.correct{border-color:var(--good);background:var(--goodbg);color:var(--good)}.option.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.option strong{display:inline-block;width:22px}.reveal-row{padding:0 17px 15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.feedback{font-weight:700;font-size:13px}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre-wrap}
.empty{text-align:center;padding:40px;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:650px){.qhead{padding:14px}.visual,.options,.reveal-row{padding-left:14px;padding-right:14px}}
</style>

<script>
const QUESTIONS=[{"id":1,"question":"How will Cortex XSIAM help with raw log ingestion from third-party sources in an existing infrastructure?","options":{"A":"Any structured logs coming into it are left completely unchanged, and only metadata is added to the raw data.","B":"For structured logs, like CEF, LEEF, and JSON, it decouples the key-value pairs and saves them in table format.","C":"Any unstructured logs coming into it are left completely unchanged, and metadata is not added to the raw data.","D":"For unstructured logs, it decouples the key-value pairs and saves them in a table format."},"answer":"B","image_id":null},{"id":2,"question":"In which two locations can correlation rules be monitored for errors? (Choose two.)","options":{"A":"XDR Collector audit logs (type = Rules, subtype = Error)","B":"correlations_auditing dataset through XQL","C":"Management audit logs (type = Rules, subtype = Error)","D":"Alerts table as a health alert"},"answer":"BD","image_id":null},{"id":3,"question":"Which option should be used when customizing a dashboard in Cortex XSIAM to include a widget that will display data filtered by more than one dynamic value?","options":{"A":"Free text/number","B":"Multi-select","C":"Fixed filter","D":"Single-select"},"answer":"B","image_id":null},{"id":4,"question":"How must Cloud Identity Engine be deployed and activated on Cortex XSIAM?","options":{"A":"In a different region than Cortex XSIAM; logs can be verified using pan_dss_raw dataset","B":"In a different region than Cortex XSIAM; logs can be verified using endpoints dataset","C":"In the same region as Cortex XSIAM; logs can be verified using pan_dss_raw dataset","D":"In the same region as Cortex XSIAM; logs can be verified using endpoints dataset"},"answer":"C","image_id":null},{"id":5,"question":"Which common issue can result in sudden data ingestion loss for a data source that was previously successful?","options":{"A":"Data source is using an unsupported data format.","B":"Data source has reached its maximum storage capacity.","C":"Data source has reached its end of life for support.","D":"API key used for the integration has expired."},"answer":"D","image_id":null},{"id":6,"question":"While using the remote repository on a Development XSIAM tenant, which two objects can be pushed or pulled to the remote repository? (Choose two.)","options":{"A":"Scripts","B":"Parsing rules","C":"Lists","D":"Layouts"},"answer":"AD","image_id":null},{"id":7,"question":"When a Cortex XSIAM playbook execution reaches a breakpoint on a non-manual task, which two actions will allow the playbook to continue? (Choose two.)","options":{"A":"Disable the breakpoint and rerun the playbook from the start.","B":"Skip the task with the breakpoint to let the playbook proceed automatically.","C":"Wait for all parallel tasks to be completed before the breakpoint task resumes automatically.","D":"Click Run Script Now or Complete Manually."},"answer":"BD","image_id":null},{"id":8,"question":"What is the purpose of using rolling tokens to manage Cortex XDR agents?","options":{"A":"To periodically rotate encryption keys used for tenant communication","B":"To perform administration on agents without requiring static credentials","C":"To authorize agents to download and install content updates","D":"To temporarily disable the agents during maintenance windows"},"answer":"B","image_id":null},{"id":9,"question":"Based on the image below, which statement applies to the ability to remove tabs when creating a new alert layout?","options":{"A":"Only \"Alert Info\" tab can be removed.","B":"Only \"Alert Info\" and \"War Room\" tabs can be removed.","C":"Only \"War Room\" and \"Work Plan\" tabs can be removed.","D":"Only \"Work Plan\" tab can be removed."},"answer":"A","image_id":9},{"id":10,"question":"A Cortex XSIAM engineer is developing a playbook that uses reputation commands such as '!ip' to enrich and analyze indicators. Which statement applies to the use of reputation commands in this scenario?","options":{"A":"If no reputation integration instance is configured, the '!ip' command will execute but will return no results.","B":"Reputation commands such as '!ip' will fail if the required reputation integration instance is not configured and enabled.","C":"The mapping flow for enrichment commands is disabled if extraction is set to \"None.\"","D":"Enrichment data will not be saved to the indicator unless the extraction setting is manually configured in the playbook task."},"answer":"B","image_id":null},{"id":11,"question":"An engineer wants to onboard data from a third-party vendor’s firewall. There is no content pack available for it, so the engineer creates custom data source integration and parsing rules to generate a dataset with the firewall data. How can the analytics capabilities of Cortex XSIAM be used on the data?","options":{"A":"Create a behavioral indicator of compromise (BIOC) rule on the network fields (source IP, source port, target IP, target port, IP protocol).","B":"Create a data model rule with network fields mapped (source IP, source port, target IP, target port, IP protocol).","C":"Create a correlation rule on the network fields (source IP, source port, target IP, target port, IP protocol).","D":"Create a parsing rule and ensure the network fields exist (source IP, source port, target IP, target port, IP protocol)."},"answer":"B","image_id":null},{"id":12,"question":"Which two requirements must be met for a Cortex XDR agent to successfully use the Broker VM as a download source for content updates? (Choose two.)","options":{"A":"Device Configuration profile applied to the XDR agent must specify the Broker VM as a Download Source.","B":"Agent Settings profile applied to the XDR agent must specify the Broker VM as a Download Source.","C":"Broker VM must be configured with an FQDN.","D":"XDR agent must authenticate to the Broker VM using a machine certificate."},"answer":"BC","image_id":null},{"id":13,"question":"During a new Cortex XSIAM deployment, a user consistently experiences timeout sessions while trying to connect to the agent through Live Terminal, even though the firewall engineer has confirmed that all source IP addresses, port 443, and destinations are allowed. What could be causing these persistent timeout issues?","options":{"A":"User does not have administrative privileges on the managed endpoint.","B":"SSL Decryption is currently being used to inspect the underlying traffic.","C":"NTP is not synchronized with the server time.","D":"Live Terminal feature is not supported on the current OS."},"answer":"B","image_id":null},{"id":14,"question":"What should be considered when creating a custom incident domain?","options":{"A":"Alert grouping will not apply, but SmartScore will.","B":"Alert grouping will apply, but SmartScore will not.","C":"Alert grouping and SmartScore will not be applied to incidents.","D":"Alert grouping and SmartScore will be applied to incidents."},"answer":"C","image_id":null},{"id":15,"question":"How does Cortex XSIAM manage licensing for Kubernetes environments?","options":{"A":"Managed per namespace and returned when the namespace is decommissioned","B":"Issued per container and returned upon container termination","C":"Issued for each node and returned when the agent is removed or the node is deleted","D":"Applied per service deployment and returned upon service deactivation"},"answer":"C","image_id":null},{"id":16,"question":"A Cortex XSIAM engineer is preparing to install a new content pack and notices that there are several optional content packs associated with the main one that needs to be installed. What must the engineer take into consideration when deciding whether or not to install the optional content packs?","options":{"A":"Mandatory dependencies required by the optional content packs are automatically included during installation. The engineer should consider the additional functionality and potential impact on system performance.","B":"The optional content packs without their associated dependencies are installed first, and then the main content pack installation is triggered. The engineer should ensure that the optional content packs do not conflict with existing configurations.","C":"Optional content packs are installed without any dependencies, as they are not necessary. The engineer should only install them if they require the additional features.","D":"Only the selected optional content packs are installed, without including any additional dependencies. The engineer should manually check for any required dependencies."},"answer":"A","image_id":null},{"id":17,"question":"In the Incident War Room, which command is used to update incident fields identified in the incident layout?","options":{"A":"!setIncidentFields","B":"!setParentIncidentFields","C":"!setParentIncidentContext","D":"!updateParentIncidentFields"},"answer":"B","image_id":null},{"id":18,"question":"Based on the images below, which command will allow the context data to be displayed as a table when troubleshooting a playbook task?","options":{"A":"!ConvertTableToHTML table=${parentIncidentFields.custom_fields}","B":"!JsonToTable value=${parentIncidentFields.custom_fields}","C":"!ToTable data=${parentIncidentFields.custom_fields.incidentassignment}","D":"!ExtractHTMLTables html=${parentIncidentFields.custom_fields.incidentassignment}"},"answer":"B","image_id":18},{"id":19,"question":"What is the role of \"in\" in the query line below? action_local_port in (1122, 2234)","options":{"A":"Operand","B":"Operator","C":"Function","D":"Range"},"answer":"B","image_id":null},{"id":20,"question":"Which section of a parsing rule defines the newly created dataset?","options":{"A":"RULE","B":"COLLECT","C":"INGEST","D":"CONST"},"answer":"C","image_id":null},{"id":21,"question":"Which step must be taken to enable Cloud Identity Engine on Cortex XSIAM?","options":{"A":"Enable SSO integration.","B":"Activate it in the Customer Support Portal.","C":"Activate it on HUB.","D":"Enable Active Directory log collection."},"answer":"C","image_id":null},{"id":22,"question":"A vulnerability analyst asks a Cortex XSIAM engineer to identify assets vulnerable to newly reported zero-day CVE affecting the \"ai_app\" application and versions 12.1, 12.2, 12.4, and 12.5. Which XQL query will provide the required result?","options":{"A":"dataset = va_cves | filter affected_products contains \"ai_app\" | fields affected_hosts, affected_products","B":"dataset = xdr_data | filter event_type = ENUM.PROCESS | filter action_process_image_name = \"ai_app\" | filter action_process_file_info not in (\"12.1\", \"12.2\", \"12.4\", \"12.5\")","C":"preset = host_inventory_applications | filter application_name contains \"ai_app\" and version in (\"12.1\", \"12.2\", \"12.4\", \"12.5\")","D":"dataset = host_inventory | filter applicationName contains \"ai_app\" | filter applicationVersion not in (\"12.1\", \"12.2\", \"12.4\", \"12.5\")"},"answer":"C","image_id":22},{"id":23,"question":"When Cortex XDR agents are on servers in a zone with no internet access, which configuration will keep them communicating with the platform?","options":{"A":"Logging service in the isolated zone","B":"Broker VM","C":"Integration using filebeat","D":"Engine"},"answer":"B","image_id":null},{"id":24,"question":"Which installer type should be used when upgrading a non-Linux Kubernetes cluster?","options":{"A":"Standalone","B":"Helm","C":"Upgrade from ESM","D":"Kubernetes"},"answer":"B","image_id":null},{"id":25,"question":"A systems engineer overseeing the integration of data from various sources through data pipelines into Cortex XSIAM notices modifications occurring during the ingestion process, and these modifications reduce the accuracy of threat detection and response. The engineer needs to assess the risks associated with the pre-ingestion data modifications and develop effective solutions for data integrity and system efficacy. Which set of steps must be followed to meet these goals?","options":{"A":"Develop an advanced monitoring system to track and log all changes made to data during ingestion, and use analytics to compare pre- and post-ingestion states based on XDM to identify and mitigate discrepancies.","B":"Design a hybrid approach for critical data fields to be safeguarded against modifications during ingestion, while less critical data fields undergo allowable modifications that are rectified post-ingestion by using XDM to balance performance with data integrity.","C":"Implement a pre-ingestion data validation process that aligns with the post-ingestion standards set by XDM, ensuring data consistency and integrity before it enters Cortex XSIAM.","D":"Establish a process to minimize data modifications during ingestion, prioritizing raw data capture and using XDM post-ingestion for necessary transformations and integrity checks."},"answer":"D","image_id":null},{"id":26,"question":"A security engineer notices that in the past week ingestion has spiked significantly. Upon investigating the anomaly, it is determined that a custom application developed in-house caused the spike. The custom application is sending syslog to the Broker VM Syslog Collector applet. The engineer consults with the SOC analyst, who determines that 90% of the logs from the custom application are not used. What can the engineer configure to reduce the ingestion?","options":{"A":"Parsing rule to drop the unnecessary data at the Broker VM","B":"Data model rule to drop the unnecessary data","C":"Correlation rule on the Cortex XSIAM server to drop the unnecessary data","D":"Data model rule to map the useful data"},"answer":"A","image_id":null},{"id":27,"question":"An engineer is conducting a threat actor emulated test to determine which Cortex XDR module would provide protection or alert on a real-world attack. The first test was prevented. Which action must the engineer take to enable continued testing?","options":{"A":"Remove the hash from the restrictions profile.","B":"Add an indicator exclusion.","C":"Add a prevention rule.","D":"Change the profile from \"alert\" to \"prevent\" for the BTP module."},"answer":"B","image_id":null},{"id":28,"question":"A Cortex XSIAM engineer adds a disable injection and prevention rule for a specific running process. After an hour, the engineer disables the rule to reinstate the security capabilities, but the capabilities are not applied. What is the explanation for this behavior?","options":{"A":"The engineer needs to restart the process to get back the security capabilities.","B":"The engineer needs a support exception to get back the security capabilities.","C":"The engineer needs to wait for the time period configured in the rule to pass first.","D":"The engineer can disable the rule, but security capabilities are not applied to the process."},"answer":"A","image_id":null},{"id":29,"question":"What is the function of the \"MODEL\" section when creating a data model rule?","options":{"A":"To make a list of all the relevant fields to be mapped from the logs to XDM","B":"To define the mapping between a single dataset and XDM","C":"To finalize rule definition with all XQL statements","D":"To map log fields to corresponding Cortex XSIAM Data Model (XDM) fields"},"answer":"B","image_id":null},{"id":30,"question":"What is the primary benefit of setting the \"--memory-swap\" option to \"-1\" during Cortex XSIAM engine deployment?","options":{"A":"It enhances the network throughput by optimizing memory usage.","B":"It increases the total disk space available to the engine.","C":"It allows the engine to operate without requiring swap capabilities.","D":"It automatically doubles the available RAM to the engine."},"answer":"C","image_id":null},{"id":31,"question":"A CISO has asked an engineer to create a custom dashboard in Cortex XSIAM that can be filtered to show incidents assigned to a specific user. Which feature should be used to filter the incident data in the dashboard?","options":{"A":"Filters and inputs in the custom dashboard","B":"Report template to set the incident user filter","C":"Visualization filter options in the widget configuration","D":"Incident summary view to filter by user"},"answer":"A","image_id":null},{"id":32,"question":"How can a Cortex XSIAM engineer resolve the issue when a SOC analyst escalates missing details after merging two similar incidents?","options":{"A":"Check the War Room of the destination incident.","B":"Examine the incident context of the source incident.","C":"Unmerge the incidents and copy the missing details into the incident notes.","D":"Check the child incident of the destination incident."},"answer":"A","image_id":null},{"id":33,"question":"Which cytool command will look up the policy being applied to a Cortex XDR agent?","options":{"A":"cytool adaptive_policy interval 0","B":"cytool payload_execution query","C":"cytool adaptive_policy recalc","D":"cytool persist print agent_settings.db"},"answer":"D","image_id":null},{"id":34,"question":"A file for a support exception that needs to be updated locally on a Linux endpoint has been supplied. Which cytool command will upload this support exception file to the endpoint?","options":{"A":"cytool upload suexfile -target </local/file/path>","B":"cytool upload suex -file </local/file/path>","C":"cytool import suex -path </local/file/path>","D":"cytool import suexfile -path </local/file/path>"},"answer":"C","image_id":null},{"id":35,"question":"Using the integrationContext object, how is data stored and retrieved between integration command runs in Cortex XSIAM?","options":{"A":"The integrationContex object can only store strings, not key-value dictionaries.","B":"The integrationContex object is retrieved and set using the test-module command.","C":"The get_integration_context() method overrides the existing object that is stored.","D":"The integrationContex object supports get_integration_context() and set_integration_context()."},"answer":"D","image_id":null},{"id":36,"question":"Which types of content may be included in a Marketplace content pack?","options":{"A":"Integrations, playbooks, parsers, and server configuration keys","B":"Predefined dashboards, indicators, and reports","C":"Scripts, playbooks, integrations, and correlation rules","D":"Behavioral indicator of compromise (BIOC) rules, layouts, and custom dashboards"},"answer":"C","image_id":null},{"id":37,"question":"Cortex XSIAM has not received any logs for 30 minutes from a Palo Alto Networks NGFW named \"MainFW.” An engineer wants to create an alert for this scenario. Correlation rule settings include: Time Schedule: Every 30 minutes - Query Timeframe: 30 minutes - Action: Generate alert - Alert Name: No logs received from MainFW in the past 30 minutes Which query should be used in the correlation rule?","options":{"A":"dataset = collection_auditing | filter collector_type = \"NGFW\" and instance = \"MainFW\" | comp count_distinct(description) as total_events by instance | filter total_events = 0","B":"preset = metrics_view | filter vendor = \"PANW\" and product = \"NGFW\" and _reporting_device_name = \"MainFW\" | comp count_distinct(total_event_count) as total_events by _reporting_device_name | filter total_events = 0","C":"dataset = collection_auditing | filter collector_type = \"NGFW\" and instance = \"MainFW\" | comp values(description) as total_events by instance | filter total_events = 0","D":"preset = metrics_view | filter vendor = \"PANW\" and product = \"NGFW\" and _reporting_device_name = \"MainFW\" | comp sum(total_event_count) as total_events by _reporting_device_name | filter total_events = 0"},"answer":"D","image_id":37},{"id":38,"question":"A Cortex XSIAM engineer at a SOC downgrades a critical threat intelligence content pack from the Cortex Marketplace while performing routine maintenance. As a result, the SOC team loses access to the latest threat intelligence data. Which action will restore the functionality of the content pack to its previously installed version?","options":{"A":"Contact Palo Alto Networks Support to create an exception to revert to the previously installed version.","B":"Back up the current configuration and data, then revert to the previously installed version.","C":"Remove all integrations and playbooks associated with the content pack, then revert to the previously installed version.","D":"Directly reinstall the previously installed version over the current one."},"answer":"D","image_id":null},{"id":39,"question":"Which two alert notification options can be configured without creating a playbook? (Choose two.)","options":{"A":"Pager Duty","B":"Email","C":"Slack","D":"SMS"},"answer":"BC","image_id":null},{"id":40,"question":"An engineer needs to migrate Cortex XDR agents without internet connection from Cortex XSIAM tenant A to Cortex XSIAM tenant B. There is a broker configured for each tenant. This is the communication flow: XDR agents <-> Broker A <-> XSIAM tenant A XDR agents <-> Broker B <-> XSIAM tenant B Which two steps should be taken before moving the agents? (Choose two.)","options":{"A":"Install a new Broker C on site B, and register it into Cortex XSIAM tenant A.","B":"Install a new Broker C on site and register it into Cortex XSIAM tenant B.","C":"Also register Broker A to Cortex XSIAM tenant B.","D":"Select all endpoints in the console and add a new Broker C as proxy."},"answer":"BC","image_id":null},{"id":41,"question":"Which field is automatically mapped from the dataset to the data model when creating a data model rule?","options":{"A":"_event_type","B":"_insert_time","C":"_host_name","D":"_cloud_id"},"answer":"B","image_id":null},{"id":42,"question":"A Cortex XSIAM engineer plans to add Kafka and Syslog Collectors to a Broker VM cluster. What are two expected behaviors of the applets when they are added to the cluster? (Choose two.)","options":{"A":"Syslog Collector applet is automatically initiated, enters an active state on the primary node, and is on standby on the standby nodes.","B":"Kafka Collector applet is automatically initiated, enters an active state on the primary node, and is on standby on the standby nodes.","C":"Syslog Collector applet is active on all cluster nodes, including primary and standby.","D":"Kafka Collector applet is active on all cluster nodes, including primary and standby."},"answer":"BC","image_id":null},{"id":43,"question":"Based on the _raw_log and XQL query information below, what will be the result(s) of the temp_value?","options":{"A":"123 192.168.10.1","B":"20","C":"10.120.80.2","D":"149.235.219.208 59977"},"answer":"A","image_id":43},{"id":44,"question":"When activating the Cortex XSIAM tenant, how is the data at rest configured with AES 128 encryption?","options":{"A":"Under Advanced -> Encryption Method, choose the desired encryption method during the initial setup of the tenant.","B":"Under Advanced, choose \"BYOK,\" and adhere to the wizard's instructions as outlined in the encryption method section.","C":"Create encryption keys with AES 128 and upload it securely through Cortex Gateway.","D":"Under Advanced -> Encryption Method, choose the desired encryption method after the initial setup of the tenant."},"answer":"A","image_id":null},{"id":45,"question":"A sub-playbook is configured to loop with a For Each Input. The following inputs are given to the sub-playbook: Input x: W,X,Y,Z - Input y: a,b,c,d - Input z: 9 - Which inputs will be used for the second iteration of the loop?","options":{"A":"a,b,c,d","B":"X,b,9","C":"X,b","D":"X,b,c"},"answer":"B","image_id":45},{"id":46,"question":"The following string is a value of a key named \"Data2\" in the context: {\"@admin\":\"admin\",\"@dirtyld\":\"1\",\"@loc\":\"Lab\",\"@name\":\"default1\",\"@oldname\":\"Test\",\"@time\":\"2024/08/28 07:45:15\",\"alert\": {\"@admin\":\"admin\",\"@dirtyld\":\"2\",\"@time\":\"2024/08/28 07:45:15\",\"member\":{\"#text\":\" Based on the image below, what will be displayed in the \"Test result\" field when the \"Test\" button is pressed?","options":{"A":"1","B":"\"1","C":"2","D":"\"2"},"answer":"A","image_id":46},{"id":47,"question":"A Cortex XDR agent is installed on an endpoint, but the agent is unable to download content updates and has not registered with the Cortex XSIAM server. An engineer troubleshoots the network connection and determines that, by design, this endpoint does not have direct internet access to the required network destinations for the Cortex XDR agent traffic. A Broker VM that has the local agent settings applet enabled with Agent Proxy configured is reachable by the endpoint. The Broker VM details are as follows: FQDN: crtxbroker01.company.net - Proxy listening port: 8888 - How should the engineer configure the Cortex XDR agent to use the existing Broker VM as a proxy for the agent network traffic?","options":{"A":"cytool proxy set \"crtxbroker01. company.net: 8888\"","B":"cytool config proxy --host crtxbroker01.company.net --port 8888","C":"cytool set proxy --host crtxbroker01.company.net --port 8888","D":"cytool proxy config \"crtxbroker01.company.net:8888\""},"answer":"A","image_id":null},{"id":48,"question":"A Behavioral Threat Protection (BTP) alert is triggered with an action of \"Prevented (Blocked)\" on one of several application servers running Windows Server 2022. The investigation determines the involved processes to be legitimate core OS binaries, and the description from the triggered BTP rule is an acceptable risk for the company to allow the same activity in the future. This type of activity is only expected on the endpoints that are members of the endpoint group \"AppServers,\" which already has a separate prevention policy rule with an exceptions profile named \"Exceptions-AppServers\" and a malware profile named \"Malware-AppServers.\" The CGO that was terminated has the following properties: SHA256: eb71ea69dd19f728ab9240565e8c7efb59821e19e3788e289301e1e74940c208 File path: C:\\Windows\\System32\\cmd.exe Digital Signer: Microsoft Corporation How should the exception be created so that it is scoped as narrowly as possible to minimize the security gap?","options":{"A":"Create the exception via the alert itself, selecting the CGO hash, CGO signer, CGO process path, and applying the scope to the \"Exceptions- AppServers\" profile.","B":"Create a Disable Prevention Rule via Exceptions Configuration with the following selections:","C":"Create a Legacy Agent Exception via Exceptions Configuration with the following selections:","D":"Create the exception via the alert itself, selecting the CGO hash, CGO signer, CGO process path, and applying the scope to \"Global.\""},"answer":"A","image_id":null},{"id":49,"question":"Which action will prevent the automatic extraction of indicators such as IP addresses and URLs from a script's output?","options":{"A":"Add 'ExtractIndicators': False to the script.","B":"Add 'IgnoreAutoExtract': True to the script.","C":"Use 'AutoExtract': False in the script.","D":"Set 'IndicatorExtraction': None in the script."},"answer":"B","image_id":null},{"id":50,"question":"An application which ingests custom application logs is hosted in an on-premises virtual environment on an Ubuntu server, and it logs locally to a .csv file. Which set of actions will allow the ingestion of the .csv logs into Cortex XSIAM directly from the server?","options":{"A":"Install a Broker VM in the environment, and configure the CSV Collector to collect the files of interest.","B":"Install a Cortex XDR agent on the Ubuntu server, and configure the agent to collect the files of interest.","C":"Install a Broker VM in the environment, and migrate the application to the Broker VM.","D":"Install XDR Collector on the Ubuntu server, and configure the agent to collect the files of interest."},"answer":"A","image_id":null},{"id":51,"question":"Which action is required to enable use of a custom script in an alert layout?","options":{"A":"Tag the script with \"dynamic-section,\" add a general purpose dynamic section, and edit the section settings to add the automation script.","B":"Tag the script with \"general-purpose-dynamic-section,\" add a custom script section, and edit the section settings to add the automation script.","C":"Add a general purpose dynamic section and edit the section settings to add the automation script.","D":"Tag the script with \"general-purpose-dynamic-section,\" add a general purpose dynamic section, and edit the section settings to add the automation script."},"answer":"A","image_id":null},{"id":52,"question":"What is the reason all Broker VM options are greyed out when a user attempts to select a Broker VM as a download source in the Agent Settings profile?","options":{"A":"The Broker VM is offline.","B":"NTP is not synchronized properly on the Broker VM.","C":"Local Agent Setting applet is currently activated without SSL certificate.","D":"Local Agent Setting applet is currently activated without FQDN."},"answer":"D","image_id":null},{"id":53,"question":"What is a key characteristic of a parsing rule in Cortex XSIAM?","options":{"A":"It uses regular expressions exclusively for data modifications, discards unmatched logs by default, and only retains fields with non-null values.","B":"It is bound to all vendors and products, performs data parsing once per log, and does not allow grouping.","C":"It is bound to a specific vendor and product, performs data parsing once per log, and does not allow grouping.","D":"It is bound to a specific vendor and product which allow grouping with a no-match policy, and retains all fields."},"answer":"D","image_id":null},{"id":54,"question":"Which type of parsing error is categorized in the dataset \"parsing_rules_errors\"?","options":{"A":"Compilation","B":"Unrecognized code","C":"Invalid syntax","D":"Data mismatch"},"answer":"A","image_id":null},{"id":55,"question":"Before initiating a malware scan action on a Linux workstation, an engineer notices that the Cortex XDR agent's operational status on the workstation is reporting as \"partially protected.\" There have been no configuration changes made from the Cortex XSIAM server. What are two explanations for this operational status? (Choose two.)","options":{"A":"The Linux endpoint is currently running 4.0 kernel version.","B":"The Linux endpoint's kernel modules failed to load due to unsupported kernel versions.","C":"The agent is outdated and requires an upgrade to the latest version to regain full protection.","D":"The agent was manually disabled on the endpoint by the user or an administrator."},"answer":"BC","image_id":null},{"id":56,"question":"A Cortex XSIAM engineer is implementing role-based access control (RBAC) and scope-based access control (SBAC) for users accessing the Cortex XSIAM tenant with the following requirements: Users managing machines in Europe should be able to manage and control all endpoints and installations, create profiles and policies, view alerts, and initiate Live Terminal, but only for endpoints in the Europe region. Users managing machines in Europe should not be able to create, modify, or delete new or existing user roles. The Europe region endpoints are identified by both of the following: Endpoint Tag = \"Europe-Servers\" and Endpoint Group = \"Europe\" for servers in Europe Endpoint Group = \"Europe\" and Endpoint Tag = \"Europe-Workstation\" for workstations in Europe Which two sets of implementation actions should the engineer take? (Choose two.)","options":{"A":"Verify and confirm that SBAC mode under \"Server Settings\" is set to \"Restrictive,\" and assign \"EG:Europe\" under the user permission scope configuration.","B":"Use the pre-defined roles, assign the \"Instance Administrator\" role to the user or user group managing Europe-based endpoints.","C":"Verify and confirm that SBAC mode under \"Server Settings\" is set to \"Permissive,\" and assign \"EG:Europe\" under the user permission scope configuration.","D":"Use the pre-defined roles, assign the \"Privileged IT Admin\" role to the user or user group managing Europe-based endpoints."},"answer":"AD","image_id":null},{"id":57,"question":"Administrators from Building 3 have been added to Cortex XSIAM to perform limited functions on a subset of endpoints. Custom roles have been created and applied to the administrators to limit their permissions, but their access should also be constrained through the principle of least privilege according to the endpoints they are allowed to manage. All endpoints are part of an endpoint group named \"Building3,\" and some endpoints may also be members of other endpoint groups. Which technical control will restrict the ability of the administrators to manage endpoints outside of their area of responsibility, while maintaining visibility to Building 3's endpoints?","options":{"A":"SBAC enabled in Building 3's IP range with the \"EG:Building3\" tag assigned to each administrator's scope","B":"SBAC enabled in Permissive Mode with the \"EG:Building3\" tag assigned to each administrator's scope","C":"SBAC enabled in Restrictive Mode with the \"EG:Building3\" tag assigned to each administrator's scope","D":"SBAC enabled globally with the \"EG:Building3\" tag assigned to each administrator's scope"},"answer":"C","image_id":null},{"id":58,"question":"While using the playbook debugger, an engineer attaches the context of an alert as test data. What happens with respect to the interactions with the list objects via tasks in this scenario?","options":{"A":"The original content of the list and the original context are not altered, because Cortex XSIAM is running inside debug mode.","B":"The original content of the list is not altered, but the original context is, because XSIAM commands are running within debug mode.","C":"The original content of the list is altered, but the original context is not, because Cortex XSIAM commands interact directly with the original list objects within debug mode.","D":"The original content of the list and the original context are altered, because Cortex XSIAM tasks interact directly with the objects, even within debug mode."},"answer":"A","image_id":null},{"id":59,"question":"What is the primary function of the URL \"https://<region>-docker.pkg.dev\" in the context of a Palo Alto Networks infrastructure?","options":{"A":"It downloads Docker content updates.","B":"It downloads Kubernetes images for agent installation.","C":"It imports Docker licensing.","D":"It downloads Engine Docker containers."},"answer":"D","image_id":null},{"id":60,"question":"An administrator is preparing to activate a new Cortex XSIAM tenant and must ensure the data-at-rest encryption meets specific organization requirements. At which stage of the deployment must the encryption method be selected?","options":{"A":"During the purchase process","B":"During the initial tenant activation process","C":"After the tenant is active","D":"Before activation"},"answer":"B","image_id":null},{"id":61,"question":"After configuring Cloud Identity Engine, which dataset should be queried to validate proper ingestion of Active Directory data?","options":{"A":"auth_logs","B":"external_services","C":"pan_dss_raw","D":"agent_auditing"},"answer":"C","image_id":null},{"id":62,"question":"Which exception type should be configured when globally blocking a specific SHA256 hash but allowing its execution on some endpoints in the development environment?","options":{"A":"Support Exception Rules","B":"Agent Alert Exclusion","C":"Legacy Agent Exception","D":"Disable Prevention Rules"},"answer":"D","image_id":null},{"id":63,"question":"A security engineer is designing a playbook task to automatically reassign an incident to a specific owner and update the Details field with new information gathered during the investigation. Which script should be selected in the playbook task to perform these updates?","options":{"A":"setIncident","B":"IncidentUpdate","C":"ContextToField","D":"FieldMapper"},"answer":"A","image_id":null},{"id":64,"question":"An administrator wants to verify the specific policy rules currently applied to a running process named finance_app.exe on a Windows endpoint. Which Cytool command should be used?","options":{"A":"cytool protect query finance_app.exe","B":"cytool runtime query finance_app.exe","C":"cytool enum finance_app.exe","D":"cytool policy query finance_app.exe"},"answer":"B","image_id":null},{"id":65,"question":"An organization creates a Compliance_Audit incident domain to track policy violations separately from active cyber threats. The goal is to manage these violations without affecting the metrics of the main security operations. Which limitation applies to incidents generated within Compliance_Audit?","options":{"A":"Both alert grouping and SmartScore will function, but with lower priority.","B":"SmartScore will be applied, but incidents will not be grouped.","C":"Incidents will be grouped, but SmartScore will be disabled.","D":"Alert grouping and SmartScore will be unavailable for these incidents."},"answer":"D","image_id":null},{"id":66,"question":"A security engineer is troubleshooting a Cortex XDR agent on a remote Mac endpoint that has lost connectivity to the management console. The engineer needs to run Cytool commands locally but does not have the current supervisor password. How can the engineer obtain the necessary credentials to manage the agent functions locally?","options":{"A":"Apply a new endpoint tag to the agent to bypass authentication.","B":"Generate a password in the console using a token hash from the endpoint.","C":"Request a temporary password from the Broker VM applet.","D":"Copy the password from the Agent Installations table in the console."},"answer":"B","image_id":null},{"id":67,"question":"Based on the image below, what will fail to function correctly as a result of missing Load Balancer FQDN configuration in the Broker VM cluster configuration?","options":{"A":"Agent Installer and Content Caching","B":"All applets","C":"Files and Folders Collector applet","D":"Kafka Collector applet"},"answer":"A","image_id":67},{"id":68,"question":"A security team has integrated a threat intelligence platform with Cortex XSIAM to enhance threat detection and response capabilities. The platform provides regular updates on malicious indicators. An engineer discovers that certain indicators are incorrectly applied in Cortex XSIAM's indicator rules. After verifying that the integration is healthy and that the indicators are present and property formatted on the platform side, the engineer suspects an issue with how Cortex XSIAM initially fetched the indicators. Which action is a timely and sustainable resolution for this issue?","options":{"A":"Delete the integration instance and recreate it to force a full resynchronization.","B":"Locate the threat intelligence integration instance settings and initiate a \"re-fetch indicators\" operation.","C":"Wait for the next scheduled synchronization interval between Cortex XSIAM and the threat intelligence platform.","D":"Manually update Cortex XSIAM's correlation rules to include the missing indicators."},"answer":"B","image_id":null},{"id":69,"question":"During the initial setup of a Cortex XSIAM tenant, a consultant is configuring the platform to notify the response team of critical system events and security alerts. The goal is to avoid using playbooks for basic messaging. Which two alert notification options are available for this method of configuration? (Choose two.)","options":{"A":"Slack","B":"PagerDuty","C":"Webhook","D":"Email"},"answer":"AD","image_id":null},{"id":70,"question":"A security engineer is configuring the Cloud Identity Engine integration in Cortex XSIAM but cannot select a Cloud Identity Engine instance in the configuration dialog until the instance is activated. Which platform is used for activation?","options":{"A":"Cortex XSIAM management console","B":"Directory Sync Service agent console","C":"Hub","D":"Palo Alto Networks Customer Support Portal"},"answer":"C","image_id":null},{"id":71,"question":"A SOC team uses a default parsing rule for a firewall integration but needs to parse a proprietary field specific to their environment. The team wants to ensure the custom parsing logic runs after the default rule and remains intact during content updates. Which parsing rule section should be used?","options":{"A":"CUSTOM","B":"RULE","C":"EXTEND","D":"APPEND"},"answer":"C","image_id":null},{"id":72,"question":"In the Marketplace, a Cortex XSIAM engineer sees the revision note for a content pack with new alert fields, updated alert layouts, and a revised playbook. The engineer completes the update without errors. The new alert fields and layouts are then reflected, but the playbook is not updated. What is the reason for this behavior?","options":{"A":"The playbook is detached.","B":"The playbook was duplicated for use.","C":"The playbook is being used in incident configuration.","D":"The last execution of the playbook resulted in an error."},"answer":"A","image_id":null},{"id":73,"question":"Which two methods may be used by Cortex XSIAM to collect Windows DHCP logs? (Choose two.)","options":{"A":"Broker VM","B":"Cortex XDR agent","C":"Cortex Pathfinder","D":"XDR Collector"},"answer":"AD","image_id":null},{"id":74,"question":"An engineer is implementing Scope-Based Access Control (SBAC) alongside Role-Based Access Control (RBAC). What is the benefit of SBAC in this context?","options":{"A":"Greater visibility to the environment","B":"Dynamic permissions without the use of predefined roles","C":"Granular access based on specific tags","D":"Simplified access management by consolidating user roles and permissions"},"answer":"C","image_id":null},{"id":75,"question":"What is the function of the data source onboarding wizard in Cortex XSIAM?","options":{"A":"It provides documentation regarding advanced settings to configure a custom data source, regardless of connection method.","B":"It assists with configuring a new data source by installing required components and suggesting additional content.","C":"It simplifies access to raw data via dataset views for an onboarded data source.","D":"It helps create a dedicated HTTP receiver instance to receive logs from the data source."},"answer":"B","image_id":null},{"id":76,"question":"An engineer has successfully ingested and parsed authentication logs from a legacy VPN concentrator into a custom dataset. The engineer now wants to use Cortex XSIAM's machine learning (ML) capabilities to detect impossible travel and anomalous access attempts from this data. How can the data be made usable by the analytics engines?","options":{"A":"Use a Cortex XSIAM Data Model (XDM) rule to map parsed fields to standard XDM Authentication fields.","B":"Configure an indicator of compromise (IOC) rule to match IP addresses from the VPN logs against threat intelligence.","C":"Create a new correlation rule that queries the custom dataset for simultaneous logins.","D":"Enable the VPN analytics module in the Marketplace."},"answer":"A","image_id":null},{"id":77,"question":"A Behavioral Threat Protection (BTP) rule has blocked a legitimate administrative took network_diagnostics.exe, because it performed an action similar to credential dumping. The tool is only used by the Domain-Admins group, which is associated with a profile named Admin-Exceptions- Profile. The administrator wants to allow this tool but only when it is signed by Network-Tools-Inc and located in C:\\AdminTools\\. What is the most accurate way to implement this narrowly scoped exception?","options":{"A":"Edit the Admin-Exceptions-Profile and add a wild-card file path exception for C:\\AdminTools\\*.","B":"Use the Legacy Agent Exception configuration to exclude the entire BTP module for the Domain-Admins group.","C":"Navigate to the Global Exceptions list and add the Network-Tools-Inc signer as a trusted publisher.","D":"From the alert, create a profile exception selecting signer, path, and module, then apply it to Admin-Exceptions-Profile."},"answer":"D","image_id":null},{"id":78,"question":"A sub-playbook task is set to loop using the \"For each input\" option with the following provided values: • Input x: \"Red,\" \"Blue,\" \"Green\" • Input y: 1, 2, 3 • Input z: \"High\" Which combination of data will the sub-playbook receive when the loop reaches its final iteration?","options":{"A":"\"Green,\" 3","B":"\"Red,\" 1, \"High\"","C":"\"Red,\" \"Blue,\" \"Green,\" 1,2, 3, \"High\"","D":"\"Green,\" 3, \"High\""},"answer":"D","image_id":null},{"id":79,"question":"A security engineer is integrating several third-party firewalls and web proxies with Cortex XSIAM by using a Syslog collector. The logs are sent in Common Event Format (CEF) and JSON. How does the Cortex XSIAM ingestion engine process these structured logs to facilitate efficient querying and analysis?","options":{"A":"It stores the logs as flat text files and only applies parsing logic at the time a user runs an XQL query.","B":"It converts all logs into a proprietary binary format and discards the original raw string to save storage space.","C":"It identifies and decouples key-value pairs into a structured table format while retaining the original raw log.","D":"It encrypts the key-value pairs and requires a manual decryption key for each third-party vendor during the parsing phase."},"answer":"C","image_id":null},{"id":80,"question":"After deploying a new custom log source via the Broker VM, an engineer notices the daily ingestion quota is being exceeded. Analysis shows that a specific \"verbose\" flag on the source application is sending unneeded system state data which needs to be excluded from the logs being committed to the data lake. Which Cortex XSIAM feature allows the engineer to define the logic?","options":{"A":"Parsing rules","B":"XDM mapping","C":"Log Forwarding profiles","D":"Dataset management"},"answer":"A","image_id":null},{"id":81,"question":"An administrator attempts to initiate a Live Terminal session to a remote Windows endpoint but the connection repeatedly times out. The endpoint status is Connected in the Cortex XSIAM console, and general agent check-ins are successful. The network team confirms that traffic to the Cortex XSIAM tenant on port 443 is allowed. Which network security configuration will cause this timeout behavior?","options":{"A":"SSL decryption is enabled on the NGFW for WebSocket traffic used by Live Terminal.","B":"The endpoint is missing the required root CA certificate.","C":"The agent is communicating over port 80 instead of 443.","D":"The endpoint is located behind a NAT device without a static public IP address assigned."},"answer":"A","image_id":null},{"id":82,"question":"Alert field mapping provides which two benefits in correlation rules? (Choose two.)","options":{"A":"It improves incident grouping logic.","B":"It contributes alert data to analytics baselines.","C":"It correlates alert data with other data sources.","D":"It lists the artifacts and assets in the incident."},"answer":"AD","image_id":null},{"id":83,"question":"Which two configuration steps are crucial when enhancing the security of a Cortex XSIAM engine that needs to interface with multiple domain controllers, each requiring a unique certificate for compliance reasons? (Choose two.)","options":{"A":"Configure multiple CA certificates into the Cortex XSIAM engine and set up specific authentication profiles for each domain controller.","B":"Implement a default encryption protocol across all connections to reduce complexity.","C":"Establish a centralized certificate server that all domain controllers can access to simplify the certificate management.","D":"Modify the Cortex XSIAM engine settings to link each domain controller with its specific certificate."},"answer":"AD","image_id":null},{"id":84,"question":"An engineer is integrating third-party logs into Cortex XSIAM and observes that data transformations during ingestion are causing inconsistencies in the Analytics Engine. The engineer needs to ensure that logs are normalized to a consolidated schema with predefined data types to support out-of-the-box analytics. Which feature should be used to achieve this normalization?","options":{"A":"Data Model rules","B":"Parsing rules","C":"Dataset views","D":"Correlation rules"},"answer":"A","image_id":null},{"id":85,"question":"An analyst reports to an engineer that after merging two incidents, specific custom context fields from the source incident are no longer visible in the destination incident. What is the explanation for this behavior?","options":{"A":"Source context data is moved to the Linked Incidents tab of the destination incident.","B":"War Room entries from the source incident are deleted for security reasons.","C":"Source context data is not preserved, but War Room entries transfer to the destination incident.","D":"Source context data is hidden in the destination incident, and an unhide action must be completed manually."},"answer":"C","image_id":null},{"id":86,"question":"Which alert source has the capability to automatically map fields to the Cortex Data Model (XDM)?","options":{"A":"XDR agent","B":"Behavioral indicator of compromise (BIOC)","C":"Indicator of compromise (IOC)","D":"Correlation rule"},"answer":"D","image_id":null},{"id":87,"question":"To simplify the configuration process, which field is automatically mapped from the dataset to the data model without requiring manual configuration?","options":{"A":"_log_source","B":"_device_ip","C":"_insert_time","D":"_rule_id"},"answer":"C","image_id":null},{"id":88,"question":"A security engineer implementing a Broker VM cluster to handle high-volume data ingestion enables the Kafka and Syslog collector applets. Which two behaviors are expected? (Choose two.)","options":{"A":"The Kafka Collector applet is active on all nodes to distribute the consumer load across the cluster.","B":"The Syslog Collector applet is active on all nodes within the cluster, including primary and standby nodes.","C":"The Kafka Collector applet is active on the primary node and remains in standby on all other nodes.","D":"The Syslog Collector applet is active on the primary node only to prevent potential data duplication."},"answer":"BC","image_id":null},{"id":89,"question":"An engineer sees alerts with Medium severity in Cortex XSIAM by using the filter in the image below: How can future alerts be changed to high severity instead of medium?","options":{"A":"Create a starring configuration rule for high severity.","B":"Create a playbook with a task to change the severity to high, then create a playbook trigger for the alert.","C":"Create a similar behavioral indicator of compromise (BIOC) rule that will have a severity of high, enable it, then disable the original BIOC rule.","D":"Create a scoring rule that will assign a score of 100 to that specific alert."},"answer":"C","image_id":89},{"id":90,"question":"A security architect is planning to deploy a specialized security use case using a Marketplace content pack in Cortex XSIAM. Which set of components is bundled within these content packs for end-to-end automation and detection?","options":{"A":"Predefined global search queries, user accounts, email templates","B":"Server configuration keys, Docker images, API tokens","C":"Integrations, playbooks, scripts, correlation rules","D":"Tenant license keys, database schemas, compute resources"},"answer":"C","image_id":null},{"id":91,"question":"An organization uses a Cortex XSIAM development tenant to build and test custom SOC content before deployment. The engineer is preparing to push the validated components to the remote repository for production use. Which two objects will be included in the synchronization process to the pull tenants? (Choose two.)","options":{"A":"Integrations","B":"Lists","C":"Issue layouts","D":"Data modeling rules"},"answer":"AC","image_id":null},{"id":92,"question":"A Cortex XSIAM administrator decides to modify how indicators are handled during playbook execution, and sets the indicator extraction mode to \"None\" for a specific playbook task that runs the !domain command. Which statement describes the behavior of the mapping flow for this command?","options":{"A":"It will only trigger if the auto-extract global setting is enabled for the tenant.","B":"It is only triggered if the indicator already exists in the threat intel database.","C":"It is triggered in enrichment commands, regardless of the extraction setting.","D":"It is disabled to save system resources when extraction is not required."},"answer":"C","image_id":null},{"id":93,"question":"An administrator needs to restrict a user's view to only show endpoints located in the DMZ network segment. The endpoints are already identified with a DMZ tag. How should the administrator configure this access restriction?","options":{"A":"Configure an authentication profile that restricts login from non-DMZ IP addresses.","B":"Create a new role with DMZ permissions and assign it to the user.","C":"Create a new User Group and map it to the DMZ Active Directory group.","D":"Configure a scope using the DMZ tag and assign it to the user's group."},"answer":"D","image_id":null},{"id":94,"question":"An administrator is reviewing the content pack installation summary in the cart and notices that a content pack labeled as \"Required\" is being installed, even though it was not a requirement of the main content pack initially selected. The administrator had explicitly selected an optional content pack in the wizard. What explains the inclusion of this additional required pack?","options":{"A":"It is a core system pack that is automatically updated with every installation.","B":"It is an optional dependency that is installed by default for all packs.","C":"It is a mandatory dependency of the optional content pack that was selected.","D":"It is a promoted content pack that is automatically added to all carts by the vendor."},"answer":"C","image_id":null},{"id":95,"question":"A security administrator creates a Disable Injection and Prevention rule to troubleshoot a performance issue with a proprietary database application. Upon completing the troubleshooting, the administrator deletes the exclusion rule from the Cortex XSIAM console. Why does the Cortex XDR agent continue to show the process as unprotected?","options":{"A":"The agent must perform a full content update before the new security policy is recognized.","B":"The administrator must manually trigger a Check-in Now action for affected endpoints.","C":"The application process must be restarted for the agent to inject its protection modules.","D":"The rule remains active in the local agent cache for 24 hours to prevent policy flapping."},"answer":"C","image_id":null}];

  }).join('');
  let fb='';
  if(revealed) fb=status(q)==='correct'?'<span class="feedback good">✓ Correct</span>':`<span class="feedback bad">✗ Wrong — correct answer: ${esc(correctAnswers.join(' + '))}</span>`;
  else if(selected.length) fb=`<span class="feedback">Selected: ${esc(selected.join(', '))}${multi?' — choose '+correctAnswers.length:''}</span>`;
  const buttonDisabled=selected.length!==correctAnswers.length;
  return `<section class="card" data-id="${q.id}"><div class="qhead"><span class="qnum">Q${q.id}</span>${esc(q.question)}${multi?'<div style="font-size:12px;color:#687386;font-weight:500;margin-top:5px">Choose '+correctAnswers.length+' answers</div>':''}</div>${img}<div class="options">${opts}</div><div class="reveal-row"><button class="revealBtn" ${buttonDisabled?'disabled':''}>${revealed?'Hide result':'Reveal answer'}</button>${fb}</div></section>`;
 }).join('');
 root.querySelectorAll('.option').forEach(el=>el.onclick=()=>{const id=+el.closest('.card').dataset.id;if(state[id]?.revealed)return;const q=QUESTIONS.find(x=>x.id===id),key=el.dataset.option,multi=answers(q).length>1;let sel=state[id]?.selected||[];if(multi){sel=sel.includes(key)?sel.filter(x=>x!==key):[...sel,key]}else{sel=[key]}state[id]={selected:sel,revealed:false};render()});
 root.querySelectorAll('.revealBtn').forEach(b=>b.onclick=()=>{const id=+b.closest('.card').dataset.id;if(!state[id]?.selected)return;state[id].revealed=!state[id].revealed;render()});
}
search.oninput=render;filter.onchange=render;
document.getElementById('revealVisible').onclick=()=>{working.filter(matches).forEach(q=>{if(state[q.id]?.selected?.length===answers(q).length)state[q.id].revealed=true});render()};
document.getElementById('reset').onclick=()=>{state={};render()};
document.getElementById('shuffle').onclick=()=>{for(let i=working.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[working[i],working[j]]=[working[j],working[i]]}render()};
render();
</script>
</body>
</html>
