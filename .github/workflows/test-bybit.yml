name: Test Bybit Reachability

# Manual-only — no schedule. Confirms Bybit's public tickers endpoint
# (funding rate + open interest) is reachable from a GitHub-hosted
# runner, replacing the confirmed-451-blocked fapi.binance.com.
on:
  workflow_dispatch:

jobs:
  test-bybit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Bybit reachability test
        working-directory: scripts
        run: node test-bybit.js
