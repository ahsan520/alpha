name: Alpha Terminal Alert Runner

on:
  schedule:
    - cron: '*/15 * * * *'   # Runs every 15 minutes (heartbeat tracking)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Telegram messages)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: alert-runner
  cancel-in-progress: false

jobs:
  run-alerts:
    name: Check alerts & positions
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      # ── Write env.js with real credentials (runtime only ──
      - name: Write env.js (runtime credentials)
        env:
          GH_PAT:             ${{ secrets.GH_PAT }}
          GH_REPO:            ${{ vars.GH_REPO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use a standard unquoted heredoc to allow the environment variables to expand cleanly
          cat > scripts/env.js << EOF
          // Auto-generated by GitHub Actions — DO NOT edit manually.
          // Reset to blanks before every git commit — secrets never enter git history.
          // The browser receives live values via GitHub Pages during workflow run.
          window.__GH_PAT       = '${GH_PAT}';
          window.__GH_REPO      = '${GH_REPO}';
          window.__TG_TOKEN     = '${TELEGRAM_BOT_TOKEN}';
          window.__TG_CHAT      = '${TELEGRAM_CHAT_ID}';
          EOF
          
          echo "✓ env.js written (secrets present in memory only)"
          echo "  GH_PAT:  $([ -n "$GH_PAT" ] && echo '✓' || echo '✗ MISSING')"
          echo "  TG:      $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '✓' || echo '✗ MISSING')"

      # ── Ensure positions.json exists ──
      - name: Ensure positions.json exists
        run: |
          if [ ! -f scripts/positions.json ]; then
            echo '{}' > scripts/positions.json
            echo "Created empty positions.json"
          else
            COUNT=$(python3 -c "import sys,json; d=json.load(open('scripts/positions.json')); print(len(d))" 2>/dev/null || echo "?")
            echo "positions.json exists: ${COUNT} position(s)"
          fi

      # ── Run the alert runner ──
      - name: Run alert runner
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ vars.GH_REPO }}
          GH_BRANCH:          ${{ vars.GH_BRANCH || 'main' }}
          GH_POSITIONS_PATH:  ${{ vars.GH_POSITIONS_PATH || 'scripts/positions.json' }}
          TELEGRAM_ENABLED:     ${{ vars.TELEGRAM_ENABLED || 'true' }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '1' }}
          DIGEST_MODE:          ${{ vars.DIGEST_MODE || 'true' }}
          DRY_RUN:              ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          LB_MIN_SCORE:         ${{ vars.LB_MIN_SCORE || '9' }}
          LB_COOLDOWN_MIN:      ${{ vars.LB_COOLDOWN_MIN || '60' }}
          LB_HOLD_LOCK:         ${{ vars.LB_HOLD_LOCK || '20' }}
          LB_CVD_CYCLES:        ${{ vars.LB_CVD_CYCLES || '3' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN — no Telegram messages will be sent"
            node alert-runner.js --dry-run
          else
            node alert-runner.js
          fi

      # ── Commit state — RESET env.js to blanks FIRST ─────────────────────────────
      - name: Commit alert state (secrets-safe)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # STEP 1 — Overwrite variables back to empty strings before committing
          cat > scripts/env.js << 'EOF'
          // Auto-generated by GitHub Actions — DO NOT edit manually.
          // Exposes secrets as window globals so the browser can send Telegram alerts
          // and push positions.json without storing credentials in localStorage.
          window.__GH_PAT       = '';
          window.__GH_REPO      = '';
          window.__TG_TOKEN     = '';
          window.__TG_CHAT      = '';
          EOF

          # STEP 2 — Stage only safe files
          git add scripts/.alert-state.json scripts/positions.json scripts/env.js 2>/dev/null || true

          # STEP 3 — Verify env.js staged content has no real tokens (safety check)
          if git diff --cached -- scripts/env.js | grep -E "ghp_|ghs_|bot[0-9]+:" > /dev/null 2>&1; then
            echo "🚨 SAFETY ABORT — env.js appears to contain real tokens, refusing to commit"
            exit 1
          fi

          # STEP 4 — Commit and push
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update alert state [skip ci]"
            git push
          fi
