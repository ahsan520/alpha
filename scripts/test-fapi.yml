name: Test FAPI Reachability

# Manual-only — no schedule. Run once from the Actions tab to confirm
# whether fapi.binance.com (futures host) is reachable from a GitHub-hosted
# runner IP, isolated from the rest of the alert pipeline.
on:
  workflow_dispatch:

jobs:
  test-fapi:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fapi reachability test
        working-directory: scripts
        run: node test-fapi.js
